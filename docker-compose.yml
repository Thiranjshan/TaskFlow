version: '3.8'

services:
  mongo:
    image: mongo:7
    container_name: taskflow-mongo
    restart: always
    volumes:
      - mongo-data:/data/db
    ports:
      - "27017:27017"

  server:
    build: ./server
    container_name: taskflow-server
    restart: always
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGO_URI=mongodb://mongo:27017/taskflow
      - JWT_SECRET=${JWT_SECRET}
    depends_on:
      - mongo

  client:
    build:
      context: ./client
      args:
        VITE_API_URL: http://localhost:5000/api
    container_name: taskflow-client
    restart: always
    ports:
      - "80:80"
    depends_on:
      - server

volumes:
  mongo-data: